<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover — Tiny Brawler</title>
  </head>
  <body>
    <aside class="hud" aria-label="Brawler HUD">
      <header>
        <p class="kicker">Hover</p>
        <h1>Tiny brawler</h1>
      </header>
      <section>
        <h2>HP</h2>
        <p id="hud-hp" class="hp">●●●●●  5/5</p>
      </section>
      <section>
        <h2>Enemies</h2>
        <p id="hud-enemies" class="enemies">4 / 4</p>
      </section>
      <section>
        <h2>State</h2>
        <p id="hud-state" class="state">Loading</p>
        <p id="hud-clip" class="clip">clip: —</p>
      </section>
      <section>
        <h2>How to play</h2>
        <ul class="keys">
          <li><kbd>W A S D</kbd> walk · <kbd>Shift</kbd> run</li>
          <li><kbd>Space</kbd> jump · <kbd>F</kbd> punch</li>
          <li><kbd>R</kbd> restart wave</li>
        </ul>
      </section>
      <section>
        <div class="buttons">
          <button type="button" id="btn-punch">Punch</button>
        </div>
      </section>
    </aside>

    <div id="banner" class="banner" hidden>
      <p id="banner-title">Wave cleared</p>
      <p id="banner-hint">Press R for another wave</p>
    </div>

    <div id="loader" class="loader">
      <div class="loader-card">
        <p class="kicker">Hover</p>
        <h1>Loading character</h1>
        <p class="path">/models/character.glb</p>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <span id="loader-bar"></span>
        </div>
        <p id="loader-meta" class="meta">0%</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
